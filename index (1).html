<body>
  <div id="root"></div>
  <!-- React 16.0.0 shipped with the previous bundle does not support Hooks; use React 17.0.2 instead. -->
  <script crossorigin="anonymous" src="https://cdnjs.cloudflare.com/ajax/libs/react/17.0.2/umd/react.production.min.js"></script>
  <script crossorigin="anonymous" src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/17.0.2/umd/react-dom.production.min.js"></script>
  <script>
    (function(){
      function fail(message){
        document.getElementById('root').innerHTML='<div class="startup-error"><b>ARES FIRST COLONY could not start.</b><p>'+message+'</p></div>';
      }
      if (!window.React || typeof window.React.useState !== 'function' || !window.ReactDOM || typeof window.ReactDOM.render !== 'function'){
        fail('The React game engine could not load. Please confirm you are online, disable script-blocking extensions, and refresh.');
        return;
      }
      var script=document.createElement('script');
      script.src='./game.js?v=20261118-react17-fix';
      script.onerror=function(){fail('The game.js file is missing or could not be downloaded from this website.');};
      document.body.appendChild(script);
    })();
  </script>
</body>
